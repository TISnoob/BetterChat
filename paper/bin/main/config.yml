# BetterChat Paper/Folia configuration
storage:
  type: sqlite # sqlite or mariadb
  sqlite-file: betterchat.db
  mariadb:
    host: 127.0.0.1
    port: 3306
    database: betterchat
    username: betterchat
    password: change-me
    pool-size: 8

proxy-mode:
  enabled: false
  server-id: paper-1 # Give each backend a stable, unique id in proxy mode.
  secret: '' # Required in proxy mode: use the same random 32+ character secret everywhere.

defaults:
  language: en_us
  console-language: en_us
  country: EARTH

flags:
  enabled: true
  auto-detect-ip: false
  auto-detect-endpoint: 'https://ipapi.co/{ip}/json/'
  blacklist: []
  resource-pack:
    enabled: false
    url: '' # Public HTTPS URL to resource-pack/BetterChat-Flags.zip
    sha1: ''
    prompt: 'Install BetterChat Flags to see image flags.'
    required: false
    use-glyphs: false # Set true after players can download the pack.
  tab-list:
    enabled: false
    position: before-name
  nametag:
    enabled: false
    position: before-name
    worlds: [] # empty = all worlds, unless blacklisted
    blacklist-worlds: []

groups:
  enabled: false
  provider: luckperms # luckperms or vault (Vault needs a permission plugin with group support)
  language-groups: false
  nationality-groups: false
  group-prefix: betterchat_

language:
  blacklist: []

bstats:
  enabled: true
